name: install-postgres-dependency

on:
  push:
    branches:
      - feat/durable-postgres-runtime

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/durable-postgres-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install pg@latest --save --ignore-scripts --no-audit --no-fund
      - name: Commit package metadata
        shell: bash
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "pg dependency already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add Postgres client dependency"
          git push origin HEAD:feat/durable-postgres-runtime
