name: tool-registry-finalize

on:
  push:
    branches: [feat/tool-registry]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/tool-registry
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Regenerate code graph
        run: node tools/code-graph.mjs
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CODE_GRAPH.md docs/code-graph.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: refresh tool registry code graph'
          git push origin HEAD:feat/tool-registry
