name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target supervisor -t whatsapp-ai-supervisor:test .
      - run: docker build --target browser-worker -t whatsapp-ai-supervisor-browser:test .
      - run: docker build --target whatsapp-web-worker -t whatsapp-ai-supervisor-whatsapp-web:test .
      - run: docker compose config >/dev/null
