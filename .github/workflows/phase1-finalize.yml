name: phase1-finalize

on:
  push:
    branches: [feat/messaging-agent-phase1]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/messaging-agent-phase1
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fix plan references and regenerate graph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-08-27-messaging-agent-phase1.md')
          text = path.read_text()
          text = text.replace('migrations/002_messaging_ownership.sql', 'migrations/002_conversation_ownership.sql')
          path.write_text(text)
          PY
          node tools/code-graph.mjs
      - name: Commit generated finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-08-27-messaging-agent-phase1.md docs/CODE_GRAPH.md docs/code-graph.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: finalize phase1 review artifacts'
          git push origin HEAD:feat/messaging-agent-phase1
