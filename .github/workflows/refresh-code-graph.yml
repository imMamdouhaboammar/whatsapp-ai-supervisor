name: refresh-code-graph

on:
  push:
    branches:
      - feat/domain-event-contracts

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/domain-event-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node tools/code-graph.mjs
      - name: Commit generated graph
        shell: bash
        run: |
          git add docs/CODE_GRAPH.md docs/code-graph.json
          if git diff --cached --quiet; then
            echo "Code graph already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh code graph"
          git push origin HEAD:feat/domain-event-contracts
